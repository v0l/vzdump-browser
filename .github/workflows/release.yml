name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Rename binary
        run: mv target/release/vzdump-browser target/release/vzdump-browser-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vzdump-browser-linux
          path: target/release/vzdump-browser-linux

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Rename binary
        run: mv target/release/vzdump-browser target/release/vzdump-browser-macos

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vzdump-browser-macos
          path: target/release/vzdump-browser-macos

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Rename binary
        run: move target\release\vzdump-browser.exe target\release\vzdump-browser-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vzdump-browser-windows
          path: target\release\vzdump-browser-windows.exe

  create-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vzdump-browser-linux/vzdump-browser-linux
            vzdump-browser-macos/vzdump-browser-macos
            vzdump-browser-windows/vzdump-browser-windows.exe
